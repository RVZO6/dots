# Core
set -g mouse on
set -g detach-on-destroy off

# Terminal
set -g default-terminal "tmux-256color"

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Copy mode
set -g mode-keys vi
bind -T copy-mode-vi Escape send-keys -X cancel

# Key bindings
bind r source-file "~/.config/tmux/tmux.conf" \; display-message "Config reloaded!"
bind -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind Q confirm-before -p "Kill the entire tmux server? (y/n)" "kill-server"
bind x kill-pane
bind X kill-window
bind -r j previous-window
bind -r k next-window
bind g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"

# Scratch popup (t for temporary)
bind t run-shell "~/.local/bin/toggle-scratch"

# Copy current working directory to clipboard (pbcopy for macOS)
bind y run-shell "tmux display-message -p '#{pane_current_path}' | pbcopy"

# Quick jump to common directories
bind d run-shell "tmux neww -c ~/Downloads ~/.local/bin/tmux-sessionizer"
bind e run-shell "tmux neww -c ~/Desktop ~/.local/bin/tmux-sessionizer"
bind v run-shell "tmux neww -c ~/vault ~/.local/bin/tmux-sessionizer"
bind c run-shell "tmux neww -c ~/.config ~/.local/bin/tmux-sessionizer"
bind p run-shell "tmux neww -c ~/projects ~/.local/bin/tmux-sessionizer"
bind o run-shell "tmux neww -c ~/Documents ~/.local/bin/tmux-sessionizer"

# Status
set -g status-position top
set -g status-justify absolute-centre
# transparent bg
set -g status-style "bg=default"

# session name on left
set -g status-left "#S "
# nothing on right
set -g status-right ""

setw -g window-status-style "fg=brightblack"
setw -g window-status-current-style "fg=green,bg=default,bold"

# set -g pane-border-style 'fg=#404040'
# set -g pane-active-border-style 'fg=cyan'
# set -g message-style 'fg=cyan,bg=default,bold'
set -g mode-style 'bold,fg=yellow'
