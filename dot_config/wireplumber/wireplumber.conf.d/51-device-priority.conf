monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*analog.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1400
        priority.driver = 1400
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.usb-harman_kardon_SoundSticks-00.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1200
        priority.driver = 1200
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_01_00.1.hdmi-stereo"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1100
        priority.driver = 1100
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_00_1f.3.iec958-stereo"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1000
        priority.driver = 1000
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_input.usb-Blue_Microphones_Yeti_X_2053SG013QL8_888-000313110306-00.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2200
        priority.driver = 2200
      }
    }
  }
]

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1300
        priority.driver = 1300
      }
    }
  }
]
