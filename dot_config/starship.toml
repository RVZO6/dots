add_newline = true
command_timeout = 200
format = "[$directory$git_branch$git_status]($style)$status$character"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold green"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
read_only = " "

[git_branch]
format = "[$branch]($style) "
style = "italic"

[git_status]
format = "[$all_status]($style)"
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked = "? "
modified = " "
stashed = ""
staged = ""
renamed = ""
deleted = ""

[status]
disabled = false
symbol = "✗"
style = "bold red"
format = "[$symbol]($style) "

[character]
error_symbol = "[❯](bold)"
success_symbol = "[❯](bold)"
vimcmd_symbol = "[$error_symbol❮](bold)"
